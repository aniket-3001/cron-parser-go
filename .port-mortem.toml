# Port Mortem submission manifest.

track = "C"                     # TypeScript -> Go
team = "aniket-3001"            # solo entry

[source]
name = "harrisiirak/cron-parser"
url = "https://github.com/harrisiirak/cron-parser"
version = "5.6.2"
commit = "aeb2a1513fd33365a6414f4137516c9482f831ed"
license = "MIT"

[port]
url = "https://github.com/aniket-3001/cron-parser-go"
language = "Go"
module = "github.com/aniket-3001/cron-parser-go"
toolchain = "go 1.24 or newer"

# Build command. One step, no make required, works on Windows as well as Unix.
build = "npm run build"
# Produces ./cron-parser, a runnable binary.
artifact = "go build -o cron-parser ./cmd/cron-parser"

[kickoff_hash]
# SHA-256 of the original test suite, computed from the upstream repository at
# kickoff, before any port code existed. Self-computed and reproducible: clone
# the source at the commit above and hash tests/*.test.ts and tests/types.d.ts.
#
# digest is sha256 over the concatenated per-file sha256sum output, in the order
# listed in tests/original/HASHES.txt.
digest = "615075d3fdbecf30b6e700d4a2125fe646b77ebb49fe797ea88577a8fb2863de"
manifest = "tests/original/HASHES.txt"
verify = "npm run verify-hashes"
files = 8

[results]
# Every figure here is generated by `npm run honest-numbers`, which writes
# HONEST-NUMBERS.md and honest-numbers.json. Nothing below is typed in by hand.
original_tests_total = 280
original_tests_passing = 280
original_tests_modified = 0

# Two readings, because the port's suite has two. The two corpus generators
# write multi-megabyte fixtures and are gated behind CRON_GEN_CORPUS=1; the
# statements only they reach are uncovered without it. Quoting the higher
# number alone would be the flattering presentation rather than the true one.
go_statement_coverage = "100%"          # CRON_GEN_CORPUS=1 go test ./cron/...
go_statement_coverage_default = "99.5%" # go test ./cron/...

go_tests_total = 111
go_tests_passing = 111        # with CRON_GEN_CORPUS=1; 109 of 109 executed otherwise

unsafe_blocks = 0
any_equivalents = 0           # no interface{}, no reflection in the library
fuzz_divergences = 0
cli_diff_commands = 124
cli_diff_identical = 124
report = "HONEST-NUMBERS.md"
